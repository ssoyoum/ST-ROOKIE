apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-internal-only
  namespace: st-rookie
spec:
  podSelector:
    matchLabels:
      app: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: st-rookie
      ports:
        - protocol: TCP
          port: 8000
