apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: st-rookie
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          # Pin this tag to the version used in the load test before production.
          image: vllm/vllm-openai:latest
          args:
            - --model
            - $(VLLM_MODEL_ID)
            - --served-model-name
            - steel-tutor
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "4096"
          env:
            - name: VLLM_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: st-rookie-llm
                  key: VLLM_MODEL_ID
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: st-rookie-llm-secrets
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: st-rookie
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
